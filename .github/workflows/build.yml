name: Build SocksTun APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip file git

      - name: Download SocksTun source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/heiher/sockstun.git \
            android-client

      - name: Set up Android command-line tools
        working-directory: android-client
        run: |
          wget --tries=3 --timeout=30 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandline-tools.zip

          mkdir -p sdk
          unzip -q commandline-tools.zip -d sdk

      - name: Accept Android SDK licenses
        working-directory: android-client
        shell: bash
        run: |
          export ANDROID_HOME="$PWD/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses

      - name: Build release APK
        working-directory: android-client
        shell: bash
        run: |
          set -eu

          export ANDROID_HOME="$PWD/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

          APK_PATH="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/SocksTun-release.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SocksTun-release-apk
          path: SocksTun-release.apk
          if-no-files-found: error
          retention-days: 7
