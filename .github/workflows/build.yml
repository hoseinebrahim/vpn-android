
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Check and build Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for Gradle wrapper..."

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)"

          if [[ -z "$WRAPPER" ]]; then
            echo "::error::No Gradle wrapper found."
            echo "An Android Gradle project is required."
            echo "The Python proxy must first be integrated with Android VpnService."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          echo "Gradle project: $PROJECT_DIR"

          chmod +x "$WRAPPER"

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-android-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7
