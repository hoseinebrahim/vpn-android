
name: Build TCP SOCKS5 VPN APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android VPN Client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;29.0.14206865

      - name: Download Android VPN project
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/heiher/sockstun.git \
            android-client

      - name: Build APK
        working-directory: android-client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCP-SOCKS5-VPN-APK
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
