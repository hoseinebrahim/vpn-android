

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -200
          echo "Checking for Android build files..."
          find . -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts -o -name AndroidManifest.xml \) \
            -print

      - name: Build APK if Gradle project exists
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f ./settings.gradle ] || [ -f ./settings.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "No Android Gradle project found."
            echo "The Python proxy must first be integrated with an Android VpnService."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
